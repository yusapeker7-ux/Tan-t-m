      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center 18%; /* Yüzü ve kafayı ekranın içine aşağıya indirir */
      z-index: -3;
      filter: brightness(0.88) contrast(1.05);
      transition: filter 0.5s ease;

    /* Şeffaf Karartma */
    .bg-overlay {

      left: 0;
      width: 100vw;

      z-index: -2;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.55);
      z-index: -1;
      pointer-events: none;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Ses Bildirim Baloncuğu */
    .unmute-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 20, 32, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(88, 101, 242, 0.4);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      animation: pulseBanner 2.5s infinite ease-in-out;
      transition: opacity 0.5s, transform 0.5s;
    }

    .unmute-banner.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(-30px);
    }

    @keyframes pulseBanner {
      0%, 100% { transform: translateX(-50%) scale(1); border-color: rgba(88, 101, 242, 0.4); }
      50% { transform: translateX(-50%) scale(1.03); border-color: rgba(88, 101, 242, 0.9); }

    .media-dock {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(14, 16, 26, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 40px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);

      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.1);
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      padding: 0 2px;
    }

    .viz-bar {
      width: 3px;
      background: #818cf8;
      border-radius: 3px;
      height: 4px;
      transition: height 0.1s ease;
    }

    .visualizer.active .viz-bar:nth-child(2) { animation: bounce 0.6s ease-in-out infinite alternate 0.2s; }
    .visualizer.active .viz-bar:nth-child(3) { animation: bounce 0.9s ease-in-out infinite alternate 0.1s; }
    .visualizer.active .viz-bar:nth-child(4) { animation: bounce 0.7s ease-in-out infinite alternate 0.3s; }

    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 16px; }

      background-position: center;

      bottom: 0;
      left: 0;

    .id-pill:hover {

      color: #fff;

    .live-status-pill {

      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;

    .live-dot {
      width: 7px;
      height: 7px;

      background: var(--status-online);

      align-items: center;
      gap: 5px;

    .skills-grid {

    .skill-card {

    .skill-card:hover {
      background: rgba(88, 101, 242, 0.15);
      border-color: rgba(129, 140, 248, 0.4);
      transform: translateY(-2px);

    .skill-icon {
      font-size: 1.2rem;

    .skill-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
    }

    .skill-level {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 8px;
      background: rgba(34, 197, 94, 0.15);

      padding: 10px;

    .primary-dc-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(88, 101, 242, 0.6);
      filter: brightness(1.1);

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(18, 20, 32, 0.95);
      border: 1px solid rgba(88, 101, 242, 0.5);

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

    const displayName = document.getElementById('display-name');
    const usernameHandle = document.getElementById('username-handle');
    const statusBadge = document.getElementById('status-badge');
    const liveStatusPill = document.getElementById('live-status-pill');
    const statusText = document.getElementById('status-text');
    const copyIdBtn = document.getElementById('copy-id-btn');
    const toast = document.getElementById('toast');

    function enableAudio() {
      bgVideo.muted = false;
      bgVideo.volume = 0.8;
      audioIcon.className = "fa-solid fa-volume-high";
      visualizer.classList.add('active');
      unmuteBanner.classList.add('hidden');
    }

    unmuteBanner.addEventListener('click', enableAudio);

    toggleAudio.addEventListener('click', () => {
      bgVideo.muted = !bgVideo.muted;
      if (bgVideo.muted) {
        audioIcon.className = "fa-solid fa-volume-xmark";
        visualizer.classList.remove('active');
      } else {
        audioIcon.className = "fa-solid fa-volume-high";
        visualizer.classList.add('active');
        unmuteBanner.classList.add('hidden');
      }
    });

    toggleVideo.addEventListener('click', () => {
      if (bgVideo.paused) {
        bgVideo.play();
        videoIcon.className = "fa-solid fa-pause";
      } else {
        bgVideo.pause();
        videoIcon.className = "fa-solid fa-play";
      }
    });

    avatarImg.src = INITIAL_DATA.avatarUrl;
    displayName.textContent = INITIAL_DATA.globalName;
    usernameHandle.textContent = `@${INITIAL_DATA.username}`;

    function initLanyard() {
      const ws = new WebSocket('wss://api.lanyard.rest/socket');
      ws.onopen = () => {
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
      };
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.op === 1) setInterval(() => ws.send(JSON.stringify({ op: 3 })), msg.d.heartbeat_interval);
        if (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE') updateLanyardData(msg.d);
      };
      ws.onerror = fallbackREST;
    }

    function fallbackREST() {
      fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
        .then(r => r.json())
        .then(json => { if (json.data) updateLanyardData(json.data); })
        .catch(() => {});
    }

    function updateLanyardData(data) {
      if (!data) return;
      const status = data.discord_status || 'online';
      statusBadge.className = `status-badge ${status}`;
      liveStatusPill.className = `live-status-pill ${status}`;

      const trStatus = { online: 'Çevrimiçi', idle: 'Boşta', dnd: 'Rahatsız Etmeyin', offline: 'Çevrimdışı' };
      statusText.textContent = trStatus[status] || 'Çevrimiçi';

      if (data.discord_user) {
        if (data.discord_user.avatar) {
          avatarImg.src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${data.discord_user.avatar}.png?size=512`;
        }
        if (data.discord_user.global_name) {
          displayName.textContent = data.discord_user.global_name;
        }
      }
    }

    initLanyard();
    fallbackREST();

    profileCard.addEventListener('mousemove', (e) => {
      const rect = profileCard.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      profileCard.style.transform = `perspective(1000px) rotateX(${(-y/rect.height)*10}deg) rotateY(${(x/rect.width)*10}deg) scale3d(1.015, 1.015, 1.015)`;
    });
    profileCard.addEventListener('mouseleave', () => {
      profileCard.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
    });

    copyIdBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(DISCORD_ID);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });

    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.6;
        this.speedX = (Math.random() - 0.5) * 0.35;
        this.speedY = (Math.random() - 0.5) * 0.35;
        this.opacity = Math.random() * 0.35 + 0.15;
      }
      update() {
        this.x += this.speedX; this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(165, 180, 252, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (let i = 0; i < 35; i++) particles.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
